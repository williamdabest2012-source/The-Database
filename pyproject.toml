[project]
name = "waffleson"
version = "1.0.0"
description = "A waffle-powered Earth-drilling clicker starring Waffleson."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pygame>=2.6"]

[project.scripts]
waffleson = "waffle_core.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["waffle_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
